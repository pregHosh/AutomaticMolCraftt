# AutomaticMolCraft — macOS on Apple Silicon (M-series GPU through PyTorch MPS)
#
#   conda env create -f environment-macos.yml
#   conda activate molcraft
#   automolcraft doctor
#   automolcraft serve
#
# Linux / WSL: use environment.yml instead.
name: molcraft
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - xtb=6.7.1
  - xtb-python
  - openbabel
  - nodejs
  - pip:
      # MolCraftDiffusion 1.13.0 (same commit as the Linux file): plain PyPI torch (with MPS) and
      # pure-torch torch_scatter / torch_cluster shims instead of the PyG C++ extensions.
      - molcraftdiffusion[mac] @ git+https://github.com/pregHosh/MolCraftDiffusion@108dc45b11b9d73cca2c16f2d1d6b0f781c4aede
      - molcraft-mac-shims @ git+https://github.com/pregHosh/MolCraftDiffusion@108dc45b11b9d73cca2c16f2d1d6b0f781c4aede#subdirectory=mac_shims
      # Analysis-tool dependencies. MolCraftDiffusion's [analyze] extra is not used: it pulls
      # posecheck, which pins pandas==2.0.0 and breaks numpy 2.
      - posebusters>=0.5.1
      - morfeus-ml
      - rmsd
      - open3d
      - pandas>=2.3,<2.4
      # This web app, with UMAP and SOAP featurisation.
      - -e .[all]
